name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Rust binary (drag-and-drop) ─────────────────────────────────
  binary:
    name: Build rustlink binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: rustlink-linux-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: rustlink-windows-x86_64.exe
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: rustlink-linux-aarch64
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ffmpeg is REQUIRED at runtime for YouTube SABR (fMP4). The binary
      # itself does not link libav*, it spawns `ffmpeg -f f32le` via
      # pipe:0 → pipe:1 (see src/player/audio_pipeline.rs:656).
      # We install it on the runner so `cargo test` can verify `ffmpeg -version`
      # and so the Docker image below can COPY it.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          which ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install cross for aarch64
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Strip (Linux)
        if: runner.os == 'Linux'
        run: strip target/${{ matrix.target }}/release/rustlink || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/rustlink
            target/${{ matrix.target }}/release/rustlink.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Create tarball (Linux x86_64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../rustlink-${{ github.ref_name }}-linux-x86_64.tar.gz rustlink
          # Also include ffmpeg binary for truly drag-and-drop (optional)
          # Users can also `apt install ffmpeg` and use the 88M rustlink alone
          which ffmpeg && cp $(which ffmpeg) ../../../ffmpeg-linux-x86_64 || true
          cd ../../../
          ls -lh rustlink-*.tar.gz ffmpeg-* 2>&1 | head -10

      - name: Upload tarball
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: rustlink-tarball
          path: |
            rustlink-*.tar.gz
            ffmpeg-linux-*
          if-no-files-found: warn

  # ── Docker image (bakes ffmpeg) ──────────────────────────────────
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: binary
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (no push on push, push on tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref_type == 'tag' }}
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

